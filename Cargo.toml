# dig-peer — the DIG Network peer client.
#
# `DigPeer::connect(peer, tls)` establishes a mutually-authenticated (mTLS) connection to a DIG
# Network peer by driving `dig-nat`'s full traversal ladder (direct → UPnP → NAT-PMP → PCP →
# hole-punch → relayed), captures the peer's verified `peer_id` + BLS-G1 identity from the handshake,
# and exposes typed RPC over `dig-rpc-protocol`. Directed control RPCs are end-to-end sealed to the
# peer's captured BLS key (§5.4) ON TOP of mTLS — a relay that terminates TLS sees only ciphertext.
# `disconnect()` cleanly tears the connection down.
#
# dig-peer is the CLIENT mirror of `dig-rpc`'s server. It wraps `dig-nat`'s `PeerConnection` (NOT
# `dig-gossip`, which is the mesh/broadcast layer). DigPeer connects to DIG Network peers; it is NOT
# ChiaPeer (Chia full-node client) — it pulls in zero chia-full-node protocol.
#
# Hierarchy: L20 (`20-domain/dig-peer`). Every dependency is strictly LOWER (reference-down):
# dig-nat (L10), dig-message (L10), dig-rpc-protocol (L00), dig-tls (L00), dig-ip (L00).
[package]
name = "dig-peer"
version = "0.14.0"
edition = "2021"
rust-version = "1.81.0"
license = "Apache-2.0 OR MIT"
description = "The DIG Network peer client: DigPeer::connect(peer, tls) drives dig-nat's full direct→relay traversal ladder, exposes typed RPC over dig-rpc-protocol, seals directed calls end-to-end to the peer's captured BLS-G1 identity (§5.4) on top of mTLS, and disconnects cleanly. The client mirror of dig-rpc's server; distinct from ChiaPeer."
repository = "https://github.com/DIG-Network/dig-peer"
readme = "README.md"
keywords = ["dig", "p2p", "rpc", "peer", "mtls"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# The transport: one connect() over the full direct→relay NAT-traversal ladder, returning a verified
# mTLS PeerConnection. dig-peer wraps this — it never hand-rolls dialing, mTLS, or peer_id pinning.
#
# `0.20` is the chia-0.36 cascade rank-two release: it is dig-nat 0.19 rebuilt on `dig-tls 0.4`
# (chia-bls 0.36.1). Requiring it here is not optional — a `0.x` MINOR is semver-INCOMPATIBLE, so a
# stale `"0.18"` would resolve a SECOND dig-nat, and with it a second dig-tls and a second chia-bls,
# putting a 0.26 `SecretKey` on the same public signature as a 0.36 `Bytes32`. That is precisely the
# internal split `dig-gossip 0.29.0` shipped. See the chia-line note below the `chia-*` deps.
#
# The requirement was ALREADY two behind (`0.18` against a released 0.19.0) before this cascade; that
# pre-existing drift is corrected here as well.
#
# Carried forward from 0.13: dig-peer's production code only ever FORWARDS the mux wire types (it
# takes `&RangeRequest`, hands back a `PeerStream`) and never builds one, so dig-nat's
# `#[non_exhaustive]` + fallible `encode()` reach only the loopback test server.
#
# `0.20` -> `0.21` (relay cascade, dig_ecosystem#3159): dig-nat 0.21 makes the relayed-dial duplicate
# guard require a LIVE circuit with a 30s idle window, so a stale circuit can no longer suppress a
# fresh dial. That fix is on THIS crate's critical path — `DigPeer::connect` drives dig-nat's full
# direct->relay ladder, so the relayed rung this crate depends on was the one being refused. dig-nat
# 0.20..0.21 changes NO public API (its diff is `src/relay.rs` internals, SPEC.md and the manifest),
# so nothing here migrates; the bump is mandatory for the `0.x`-MINOR reason above. It carries
# `dig-constants ^0.11.1` / `dig-identity ^0.7` forward transitively; this crate declares neither, and
# neither disturbs the ONE chia line below — `dig-tls` stays at `0.4` and chia-protocol/traits at
# `0.36`.
dig-nat = { version = "0.21" }
# The §5.4/#1075 recipient-seal: seal_message/open_message (DHKEM-over-G1 + BLS-G2 signature +
# anti-replay). DigPeer applies it per directed RPC to the peer's captured BLS-G1 key; fail-closed.
#
# `0.6` is an INDEPENDENT second anchor on the chia line, not a follower of the dig-tls bump: 0.5.x
# is built on chia-bls/chia-protocol 0.26, so a dig-tls-only uplift would leave this crate split.
# 0.6 carries no API change dig-peer must migrate — `SealParams`, `seal_message`, `open_message`,
# `ReplayGuard` and `DigMessageEnvelope` are unchanged in the shapes used here.
#
# `0.6` -> `0.7` MOVES WITH dig-nat 0.21, and it is mandatory rather than tidy: dig-nat 0.21 requires
# `dig-identity ^0.7` while dig-message 0.6 requires `^0.6`. This crate reaches dig-identity through
# BOTH edges, so a stale `"0.6"` here resolves TWO dig-identity copies and with them two
# `chia-sdk-utils` lines — measured directly in this crate's lock before the bump. dig-message 0.7.0
# is the manifest-only identity uplift; its sealed-envelope KAT vectors pass unchanged, so
# `SealParams` / `seal_message` / `open_message` are byte-identical.
dig-message = { version = "0.7" }
# The canonical RPC wire contract: the JSON-RPC 2.0 envelope, the method catalogue, the typed
# request/response types, and the error taxonomy. DigPeer exposes typed clients for these — never a
# hand-rolled wire type.
#
# `0.10` is a requirement bump with no code change here. A `0.x` MINOR is semver-INCOMPATIBLE, so
# staying at `"0.7"` would resolve a SECOND dig-rpc-protocol copy for any consumer that reaches the
# crate both directly and transitively through dig-peer, and the shared wire types would arrive from
# a different copy than the caller's (E0308). That is exactly the `expected FetchModuleRangeParams,
# found a different FetchModuleRangeParams` failure dig-node hit; requiring `0.10` collapses it to one.
#
# 0.8.0 carries the getAvailability redirect hop budget, 0.9.0 the four recursive-ask wire additions,
# and 0.10.x moves `ContentMissInconclusive` to -32017 while absorbing five previously
# consumer-held error codes. dig-peer references none of those integers: `DigPeerError::Rpc` forwards
# `RpcError` verbatim and never enumerates codes outside a test import, and `ErrorCode` is
# `#[non_exhaustive]`, so no exhaustive match here can break on a new variant.
#
# Carried forward from 0.6: `RangeFrame` + `FetchRangeParams` are `#[non_exhaustive]` (mirroring
# dig-nat 0.13) and neither is constructed here - the module-leg fixture builds `dig_nat::RangeFrame`.
# The dig-rpc-protocol types this crate DOES construct (`ModuleInfo`, `GetModuleInfoParams`,
# `RelayStatus`) are still NOT `#[non_exhaustive]` in 0.11.0 - re-verified against the struct
# definitions in the published 0.11.0 source (src/types.rs), and confirmed by this crate's own
# green `cargo build --all-features` on 0.11.0, which would fail to compile a plain struct
# literal against any of the three if the attribute had been added.
dig-rpc-protocol = { version = "0.11" }
# The mTLS identity: the per-peer NodeCert the caller presents and dig-nat pins the peer_id against.
# Re-exported from dig-nat, depended on directly so callers construct a NodeCert without a dig-nat
# import and so DigPeer can read the local BLS identity for sealing.
dig-tls = { version = "0.4" }

# Byte-deterministic Chia-Streamable DID/G1 wire types (Bytes32 identity id) the seal uses, plus the
# Streamable to_bytes/from_bytes trait for the sealed dig-message envelope.
#
# THE CHIA LINE IS ONE LINE, AND IT IS LOAD-BEARING. Chia types cross dig-peer's PUBLIC API from two
# directions at once: `SealingIdentity::new` takes a `chia-bls` `SecretKey` (reached via
# `dig_tls::bls`), while `seal_request` returns and `open_response` accepts a `chia-protocol`
# `Bytes32` (reached directly, here). Both are re-exported at the crate root. If those two arrive
# from different chia minors the crate is internally split, which is how `dig-gossip 0.29.0` shipped
# a 0.26 `SecretKey` beside a 0.36.1 `Bytes32` in a single signature.
#
# So `dig-nat`, `dig-message`, `dig-tls` and these two declarations MOVE TOGETHER OR NOT AT ALL. The
# split cannot silently recur: `SealingIdentity` hands `&self.secret_key` and these `Bytes32` values
# straight into dig-message's `SealParams`, so a mismatched line is an E0308 at build time rather
# than a wire-compatibility surprise at run time.
#
# `cargo tree -d` is NOT the check. `clvmr` pins its own older `chia-bls`/`chia-traits` for CLVM
# evaluation, so a duplicate is reported for any correct resolution; that copy never reaches a
# dig-peer signature. Trace each duplicate to its root instead of trusting the count.
chia-protocol = "0.36"
chia-traits = "0.36"

# Async runtime + stream I/O for the RPC framing over the mux.
tokio = { version = "1", features = ["io-util", "rt", "macros", "time", "sync"] }
# Wire (de)serialization of the JSON-RPC envelope carried over the mux stream.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Structured observability for the connect ladder + seal decisions (a warn! on a fail-closed refusal).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The crate error taxonomy.
thiserror = "1"

[dev-dependencies]
# Loopback e2e: a real dig-tls mTLS server + dig-nat PeerSession the DigPeer client connects to.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Builds the module-pull test fixture's chunk/blob hashes, so the loopback descriptor is the SAME
# content-addressed shape the real puller attributes ranges against (never a hand-written digest).
sha2 = "0.10"

[lib]
doctest = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

